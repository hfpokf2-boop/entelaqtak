name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>", html, re.IGNORECASE)
          inline_scripts = []
          for attrs, body in scripts:
              if re.search(r"\\bsrc\\s*=", attrs, re.IGNORECASE):
                  continue
              match = re.search(r"""\\btype\\s*=\\s*["']?([^"'\\s>]+)""", attrs, re.IGNORECASE)
              script_type = match.group(1).lower() if match else "text/javascript"
              if script_type not in ("text/javascript", "application/javascript", "module"):
                  continue
              if body.strip():
                  inline_scripts.append(body)

          if not inline_scripts:
              raise SystemExit("No executable inline JavaScript found")
          for number, body in enumerate(inline_scripts, 1):
              Path(f"/tmp/entelaqtak-inline-{number}.js").write_text(body, encoding="utf-8")
          print(f"Extracted {len(inline_scripts)} executable inline script(s).")
          PY
          for file in creator-suite.js enhancements.js theme.js service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done
          for file in /tmp/entelaqtak-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Audit HTML, local assets, and PWA metadata
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import json
          import re
          import xml.etree.ElementTree as ET

          errors = []
          ids_by_doc = {}
          refs_by_doc = {}

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.refs = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.errors.append(f"duplicate id: {element_id}")
                      self.ids.add(element_id)
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.refs.append((key, value))

          for doc in ("index.html", "legal.html"):
              parser = AuditParser()
              parser.feed(Path(doc).read_text(encoding="utf-8"))
              ids_by_doc[doc] = parser.ids
              refs_by_doc[doc] = parser.refs
              errors.extend(f"{doc}: {message}" for message in parser.errors)

          for doc, refs in refs_by_doc.items():
              for kind, value in refs:
                  parsed = urlparse(value)
                  if parsed.scheme or parsed.netloc or value.startswith(("data:", "javascript:", "mailto:", "tel:")):
                      continue
                  path = unquote(parsed.path)
                  target_doc = doc
                  if path:
                      target = Path(doc).parent / path
                      if path.endswith("/") or target.is_dir():
                          target = target / "index.html"
                      if not target.is_file():
                          errors.append(f"{doc}: missing local {kind} target {value}")
                          continue
                      if target.suffix.lower() in (".html", ".htm"):
                          target_doc = str(target)
                  if parsed.fragment and parsed.fragment not in ids_by_doc.get(target_doc, set()):
                      errors.append(f"{doc}: missing fragment #{parsed.fragment} in {target_doc}")

          try:
              json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          except Exception as exc:
              errors.append(f"manifest.webmanifest: invalid JSON ({exc})")

          try:
              ET.parse("sitemap.xml")
          except Exception as exc:
              errors.append(f"sitemap.xml: invalid XML ({exc})")

          worker = Path("service-worker.js").read_text(encoding="utf-8")
          match = re.search(r"const\\s+APP_FILES\\s*=\\s*\\[(.*?)\\]", worker, re.DOTALL)
          if not match:
              errors.append("service-worker.js: APP_FILES list not found")
          else:
              for cached in re.findall(r"""["']([^"']+)["']""", match.group(1)):
                  path = cached.removeprefix("./") or "index.html"
                  if not Path(path).is_file():
                      errors.append(f"service-worker.js: missing precache file {cached}")

          fb_url = "https://www.facebook.com/profile.php?id=61596964071145"
          index = Path("index.html").read_text(encoding="utf-8")
          if index.count(f'href="{fb_url}"') != 2:
              errors.append("index.html: expected the Facebook link at both the top and bottom")

          if errors:
              raise SystemExit("\\n".join(errors))
          print("HTML ids, local assets, fragments, manifest, sitemap, service-worker assets, and both Facebook links passed.")
          PY
      - name: Validate Supabase Edge Function TypeScript
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/ai-assistant/index.ts supabase/functions/elevenlabs-speech/index.ts
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
