name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-organized-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.current = None
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current = (dict(attrs), [])
              def handle_data(self, data):
                  if self.current is not None:
                      self.current[1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      attrs, chunks = self.current
                      script_type = attrs.get("type", "text/javascript").lower()
                      if "src" not in attrs and script_type in ("text/javascript", "application/javascript", "module"):
                          body = "".join(chunks)
                          if body.strip():
                              self.scripts.append(body)
                      self.current = None

          total = 0
          for doc in ("index.html", "workspace.html", "admin.html", "advertise.html"):
              parser = ScriptExtractor()
              parser.feed(Path(doc).read_text(encoding="utf-8"))
              for number, body in enumerate(parser.scripts, 1):
                  output = Path(f"/tmp/entelaqtak-{Path(doc).stem}-inline-{number}.js")
                  output.write_text(body, encoding="utf-8")
                  total += 1
          if not total:
              raise SystemExit("No executable inline JavaScript found")
          print(f"Extracted {total} executable inline script(s) from all interactive HTML pages.")
          PY
          for file in creator-suite.js enhancements.js theme.js platform-hub.js production-studio.js production-studio-pro.js sidebar-organizer.js content-pack-pro.js visitor-tracker.js service-worker.js language.js; do
            echo "Checking $file"
            node --check "$file"
          done
          for file in /tmp/entelaqtak-*-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check workspace state and event-binding regressions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const workspace = fs.readFileSync('workspace.html', 'utf8');
          const platformHub = fs.readFileSync('platform-hub.js', 'utf8');
          const worker = fs.readFileSync('service-worker.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(workspace.includes('function replaceWorkspaceState(next)'), 'Stable workspace state helper is missing.');
          for (const pattern of [/state=merged;/, /state=normalizeState\(incoming\);/, /state=normalizeState\(d\);/, /state=data\?\.data/]) {
            assert(!pattern.test(workspace), 'A workspace state replacement bypasses the stable state helper: ' + pattern);
          }
          for (const id of ['hubCalendar', 'hubAnalytics', 'hubIcs']) {
            const needle = "$('" + id + "').addEventListener('click'";
            const count = platformHub.split(needle).length - 1;
            assert(count === 1, 'Expected exactly one click handler for ' + id + ', found ' + count);
          }
          assert(worker.includes("entelaqtak-shell-v47"), 'Service worker cache version was not bumped.');
          assert(worker.includes("'./button-system.css'"), 'Button stylesheet missing from offline app shell.');
          assert(worker.includes("'./production-studio-pro.js'"), 'Production PRO module missing from offline app shell.');
          assert(worker.includes("'./production-studio-pro.css'"), 'Production PRO styles missing from offline app shell.');
          assert(worker.includes("'./content-pack-pro.js'"), 'Content pack module missing from offline app shell.');
          assert(worker.includes("'./language.js'"), 'Language module missing from offline app shell.');
          console.log('Workspace state identity, platform event bindings, and offline cache checks passed.');
          NODE
      - name: Audit dark theme and blue button states
        run: |
          python3 - <<'PY'
          from pathlib import Path
          errors = []
          versions = {
              "index.html": "20261120-organized-dark-1",
              "workspace.html": "20261120-organized-dark-1",
              "admin.html": "20261120-organized-dark-1",
              "advertise.html": "20261120-organized-dark-1",
              "legal.html": "20261120-organized-dark-1",
          }
          for page, version in versions.items():
              html = Path(page).read_text(encoding="utf-8")
              if f"design-system.css?v={version}" not in html:
                  errors.append(f"{page}: design-system.css cache version is stale")
          workspace = Path("workspace.html").read_text(encoding="utf-8")
          if "ui-polish.css?v=20261120-dark-only-1" not in workspace:
              errors.append("workspace.html: ui-polish.css cache version is stale")
          css = Path("design-system.css").read_text(encoding="utf-8")
          polish = Path("ui-polish.css").read_text(encoding="utf-8")
          buttons = Path("button-system.css").read_text(encoding="utf-8")
          production = Path("production-studio-pro.css").read_text(encoding="utf-8")
          for name, source in (("design-system.css", css), ("ui-polish.css", polish), ("button-system.css", buttons), ("production-studio-pro.css", production)):
              if source.count("{") != source.count("}"):
                  errors.append(name + ": unbalanced CSS blocks")
          required = [
              "--bg:#0B1120", "--action:#2563EB", "--action-hover:#1D4ED8",
              "button:hover", "button:active", "button:focus-visible", "button:disabled",
              "linear-gradient(115deg,#2563EB,#3B82F6)",
              ".nav button.active", ".theme-swatch.aurora", "prefers-reduced-motion:reduce",
              "button.active,#nav button.active", ".cp-output button,.cp-foot button", "button.primary,button.secondary,button.danger", "button.menu-toggle,button.theme-close", ".lang button,.theme-panel button", "#view-settings button",
          ]
          for token in required:
              if token not in css:
                  errors.append("design-system.css: missing blue/dark theme rule " + token)
          for path in ("ui-polish.css", "workspace.html"):
              source = Path(path).read_text(encoding="utf-8")
              if "rgba(139,124,246" in source or "#8b7cff" in source.lower():
                  errors.append(path + ": legacy purple accent remains")
          worker = Path("service-worker.js").read_text(encoding="utf-8")
          if "entelaqtak-shell-v47" not in worker:
              errors.append("service-worker.js: shell cache version was not bumped")
          if "'./button-system.css'" not in worker:
              errors.append("service-worker.js: button stylesheet missing from offline cache")
          if "'./production-studio-pro.js'" not in worker or "'./production-studio-pro.css'" not in worker:
              errors.append("service-worker.js: Production Studio PRO assets missing from offline cache")
          for page in versions:
              html = Path(page).read_text(encoding="utf-8")
              if 'button-system.css?v=20261120-buttons-1' not in html:
                  errors.append(f"{page}: button system stylesheet is missing")
          button_rules = [
              "linear-gradient(135deg,#2563EB", "button:hover", "button:active",
              "button:focus-visible", "button:disabled", "button[aria-busy=\"true\"]",
              "button.danger", ".theme-preset[aria-pressed=\"true\"]",
              ".quick button", "#nav button.active", "prefers-reduced-motion:reduce"
          ]
          for token in button_rules:
              if token not in buttons:
                  errors.append("button-system.css: missing button rule " + token)
          if "ignoreSearch:true" not in worker:
              errors.append("service-worker.js: versioned assets are not matched to the current offline cache")
          workspace = Path("workspace.html").read_text(encoding="utf-8")
          if "أزرق ملكي" not in workspace or "ثيم أزرق ملكي مفعّل" not in workspace:
              errors.append("workspace.html: theme preset labels are not aligned with the blue palette")
          theme = Path("theme.js").read_text(encoding="utf-8")
          if "entelaqtak-theme-v3" not in theme or "'important'" not in theme:
              errors.append("theme.js: color preset persistence does not apply over the shared theme tokens")
          if errors:
              raise SystemExit("\\n".join(errors))
          print("Dark navy/blue palette, theme presets, button variants/states, stylesheet versions, and offline cache passed.")
          PY
      - name: Audit HTML, local assets, and PWA metadata
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import json
          import xml.etree.ElementTree as ET

          errors = []
          ids_by_doc = {}
          refs_by_doc = {}

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.refs = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      if element_id in self.ids:
                          self.errors.append(f"duplicate id: {element_id}")
                      self.ids.add(element_id)
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.refs.append((key, value))

          for doc in ("index.html", "workspace.html", "admin.html", "legal.html"):
              parser = AuditParser()
              parser.feed(Path(doc).read_text(encoding="utf-8"))
              ids_by_doc[doc] = parser.ids
              refs_by_doc[doc] = parser.refs
              errors.extend(f"{doc}: {message}" for message in parser.errors)

          for doc, refs in refs_by_doc.items():
              for kind, value in refs:
                  parsed = urlparse(value)
                  if parsed.scheme or parsed.netloc or value.startswith(("data:", "javascript:", "mailto:", "tel:")):
                      continue
                  path = unquote(parsed.path)
                  target_doc = doc
                  if path:
                      target = Path(doc).parent / path
                      if path.endswith("/") or target.is_dir():
                          target = target / "index.html"
                      if not target.is_file():
                          errors.append(f"{doc}: missing local {kind} target {value}")
                          continue
                      if target.suffix.lower() in (".html", ".htm"):
                          target_doc = str(target)
                  if parsed.fragment and parsed.fragment not in ids_by_doc.get(target_doc, set()):
                      errors.append(f"{doc}: missing fragment #{parsed.fragment} in {target_doc}")

          try:
              json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          except Exception as exc:
              errors.append(f"manifest.webmanifest: invalid JSON ({exc})")

          try:
              ET.parse("sitemap.xml")
          except Exception as exc:
              errors.append(f"sitemap.xml: invalid XML ({exc})")

          worker = Path("service-worker.js").read_text(encoding="utf-8")
          marker = "const APP_FILES="
          position = worker.find(marker)
          opening = worker.find("[", position) if position >= 0 else -1
          closing = worker.find("]", opening) if opening >= 0 else -1
          if opening < 0 or closing < 0:
              errors.append("service-worker.js: APP_FILES list not found")
          else:
              for item in worker[opening + 1:closing].split(","):
                  cached = item.strip()
                  if cached[:1] in (chr(39), chr(34)) and cached[-1:] in (chr(39), chr(34)):
                      cached = cached[1:-1]
                  if not cached:
                      continue
                  path = cached.removeprefix("./") or "index.html"
                  if not Path(path).is_file():
                      errors.append(f"service-worker.js: missing precache file {cached}")

          home = Path("index.html").read_text(encoding="utf-8")
          sitemap_root = "https://sasa-antilaqatuk.github.io/entelaqtak/"
          if '<meta name="robots" content="index,follow,max-image-preview:large">' not in home:
              errors.append("index.html: public homepage must remain indexable")
          if '<link rel="canonical" href="' + sitemap_root + '">' not in home:
              errors.append("index.html: homepage canonical must point to the Pages project root")
          if "WebSite" not in home or "alternateName" not in home:
              errors.append("index.html: WebSite structured data is missing")
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")
          if sitemap_root not in sitemap_text or "<lastmod>2026-11-20</lastmod>" not in sitemap_text:
              errors.append("sitemap.xml: homepage URL or lastmod is missing")
          if "workspace.html" in sitemap_text:
              errors.append("sitemap.xml: noindex workspace must not be submitted for indexing")

          fb_url = "https://www.facebook.com/profile.php?id=61596964071145"
          index = Path("index.html").read_text(encoding="utf-8")
          if index.count(f'href="{fb_url}"') != 2:
              errors.append("index.html: expected the Facebook link at both the top and bottom")

          workspace = Path("workspace.html").read_text(encoding="utf-8")
          studio = Path("production-studio.js").read_text(encoding="utf-8")
          studio_required = [
              'src="./production-studio.js"',
              'src="./production-studio-pro.js"',
              'production-studio-pro.css?v=20261121-pro-1',
              "productionProjects:[]",
              "records('productionProjects')",
              "'productionProjects','posts'",
              "data-ai=\"research\"",
              "data-ai=\"fact\"",
              "data-ai=\"script\"",
              "data-ai=\"edit\"",
              "data-ai=\"publish\"",
              "data-action=\"calendar\"",
              "data-action=\"export\"",
          ]
          missing_studio = [item for item in studio_required if item not in (workspace + studio)]
          if missing_studio:
              errors.append("Production studio workflow missing: " + ", ".join(missing_studio))

          if errors:
              raise SystemExit("\n".join(errors))
          print("HTML ids, local assets, fragments, manifest, sitemap, service-worker assets, and both Facebook links passed.")
          PY
      - name: Audit account separation and workspace ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("workspace.html").read_text(encoding="utf-8")
          required = [
              'id="accountLoginCard"',
              'id="accountCreateCard"',
              'id="accountSessionCard"',
              'id="accountCloudCard"',
              'id="loginEmail"',
              'id="accountCreateEmail"',
              'id="accountCreatePasswordConfirm"',
              "function isolateWorkspaceForAccount(ownerId)",
              "if(currentUser)isolateWorkspaceForAccount(currentUser.id)",
              "currentUser=data.session?.user||null;",
              "function authRedirectUrl(){return 'https://sasa-antilaqatuk.github.io/entelaqtak/workspace.html';}",
              "تعذر إرسال رسالة البريد لأن إعدادات SMTP على الخادم مرفوضة أو غير مكتملة.",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing account separation guard(s): " + ", ".join(missing))
          if "$('accountEmail')" in html or "$('accountPassword')" in html:
              raise SystemExit("Legacy shared credentials are still referenced.")
          print("Independent account forms and per-user workspace isolation guards passed.")
          PY
      - name: Validate Supabase Edge Function TypeScript
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/ai-assistant/index.ts supabase/functions/elevenlabs-speech/index.ts
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
